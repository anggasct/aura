version: 1
runtime:
  max_active_turns: 4
  max_pending_turns: 64
  turn_timeout: 5m0s
  shutdown_timeout: 30s
capabilities:
  enabled: []
server:
  host: 127.0.0.1
  port: 8280
logging:
  level: info
  format: text
models:
  definitions: {}
  request_timeout: 2m0s
  streaming_idle_timeout: 1m0s
  routing:
    agent: primary
    compression: auxiliary
    curation: auxiliary
    profiling: auxiliary
    summarize: auxiliary
    title: auxiliary
storage:
  path: ""
  busy_timeout: 5s
  max_open_connections: 4
  artifact_quota: 5GiB
  backup_directory: ""
  backup_interval: 24h0m0s
  backup_retention: 7
