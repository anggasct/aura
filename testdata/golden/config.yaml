version: 1
runtime:
  max_active_turns: 4
  max_pending_turns: 64
  turn_timeout: 5m0s
  shutdown_timeout: 30s
capabilities:
  enabled: []
tools:
  workspace: /srv/aura/workspace
  max_inline_result_bytes: 65536
  exec:
    timeout: 30s
    max_stdout_bytes: 65536
    max_stderr_bytes: 65536
  fetch:
    timeout: 30s
    max_redirects: 5
    max_encoded_bytes: 2097152
    max_decoded_bytes: 8388608
  web_search:
    provider: brave
    credential_ref: env://AURA_BRAVE_API_KEY
    max_results: 5
server:
  host: 127.0.0.1
  port: 8280
logging:
  level: info
  format: text
models:
  definitions: {}
  request_timeout: 2m0s
  streaming_idle_timeout: 1m0s
  routing:
    agent: primary
    compression: auxiliary
    curation: auxiliary
    profiling: auxiliary
    summarize: auxiliary
    title: auxiliary
storage:
  path: ""
  busy_timeout: 5s
  max_open_connections: 4
  artifact_quota: 5GiB
  backup_directory: ""
  backup_interval: 24h0m0s
  backup_retention: 7
telemetry:
  exporter: none
  endpoint: ""
  credential_ref: ""
  sample_ratio: 0.1
  queue_size: 2048
  export_timeout: 5s
usage:
  currency: USD
  daily_budget_micros: 10000000
  monthly_budget_micros: 200000000
  reservation_ttl: 1h0m0s
