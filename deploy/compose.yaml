name: aura

x-aura: &aura
  image: ${AURA_IMAGE:-ghcr.io/anggasct/aura:${AURA_VERSION:?set AURA_VERSION to the release version or AURA_IMAGE to an image reference}}
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file:
    - path: ${AURA_ENV_FILE:-.env}
      required: false
  environment:
    AURA_CONFIG: /etc/aura/aura.yaml
  volumes:
    - aura-data:/var/lib/aura
    - ./aura.yaml:/etc/aura/aura.yaml:ro

services:
  aura-upgrade:
    <<: *aura
    command: ["storage", "upgrade"]
    restart: "no"
    network_mode: none

  aura:
    <<: *aura
    command: ["server"]
    restart: unless-stopped
    depends_on:
      aura-upgrade:
        condition: service_completed_successfully
    networks:
      - egress
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/usr/local/bin/aura", "status", "--probe", "live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  egress: {}

volumes:
  aura-data: {}
