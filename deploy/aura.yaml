version: 1
storage:
  path: /var/lib/aura/data
tools:
  workspace: /var/lib/aura/workspace
workflows:
  definitions_dir: /etc/aura/workflows
models:
  definitions:
    primary:
      protocol: anthropic_messages
      model: claude-sonnet-5-5
      api_key_env: ANTHROPIC_API_KEY
      capabilities:
        streaming: true
        tools: true
        structured_output: true
        reasoning: true
        context_tokens: 200000
        tokenizer: cl100k
        usage_reporting: true
