version: 2

project_name: aura

builds:
  - id: aura
    main: ./cmd/aura
    binary: aura
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/anggasct/aura/internal/cli.version={{.Version}}
      - -X github.com/anggasct/aura/internal/cli.commit={{.ShortCommit}}
      - -X github.com/anggasct/aura/internal/cli.date={{.Date}}

archives:
  - id: aura
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
