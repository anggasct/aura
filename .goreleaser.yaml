version: 2

project_name: aura

builds:
  - id: aura
    main: ./cmd/aura
    binary: aura
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/anggasct/aura/internal/cli.version={{.Version}}
      - -X github.com/anggasct/aura/internal/cli.commit={{.ShortCommit}}
      - -X github.com/anggasct/aura/internal/cli.date={{.Date}}
      - -X github.com/anggasct/aura/internal/capability.buildProfile=core
      - -X github.com/anggasct/aura/internal/capability.buildCapabilities=

archives:
  - id: aura
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

# Cosign keyless signing: in CI the OIDC token (id-token: write) makes cosign
# sign without a long-lived key. Locally `make release-snapshot` skips signing.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  disable: true
