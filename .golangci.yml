version: "2"

linters:
  enable:
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocritic
    - gosec
    - iface
    - intrange
    - makezero
    - misspell
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign

  settings:
    depguard:
      # The rules below freeze the internal/runtime package graph after its
      # decomposition into root contracts + ingress, channelhost, checkpoint,
      # engine, and adk subpackages. Every deny states the architectural
      # reason it protects; adding an allowed edge requires a deliberate
      # config change, not an incidental import.
      rules:
        # The ADK executor adapter is an implementation detail wired only by
        # the cli composition root; everything else depends on the runtime
        # boundary (AgentRuntime, TurnRequest, ToolBroker) instead. adk's
        # own files are exempt because they are the package itself.
        adk-wired-only-by-cli:
          files:
            - "**/internal/**"
            - "!**/internal/cli/**"
            - "!**/internal/runtime/adk/**"
            - "!**/internal/tools/builtin/**"
          deny:
            - pkg: github.com/anggasct/aura/internal/runtime/adk
              desc: only the cli composition root may wire the ADK executor, with the builtin tool executor adapter as the one provider-side implementation; depend on the runtime boundary types instead
        # The root package is the shared contract layer (types, errors, fake,
        # checkpoint payload). It deliberately references the ingress and
        # checkpoint contract packages — TurnRequest carries ingress
        # InputParts and the checkpoint payload is shared with the engine —
        # but must never depend on an implementation package: engine, adk,
        # or channelhost. The dependency direction for those is reversed.
        runtime-root-stays-contract-only:
          files:
            - "**/internal/runtime/*.go"
          deny:
            - pkg: github.com/anggasct/aura/internal/runtime/engine
              desc: the root contract package must not depend on the turn engine; the dependency direction is engine importing root
            - pkg: github.com/anggasct/aura/internal/runtime/adk
              desc: the root contract package must not depend on the ADK adapter; the dependency direction is adk importing root
            - pkg: github.com/anggasct/aura/internal/runtime/channelhost
              desc: channel contracts are consumed by the engine host and channel adapters, not by the shared root package
        # The engine's deliberate import set is the root contracts plus
        # ingress, channelhost, and checkpoint: the Host binds channel
        # adapters to the engine (channelhost->engine stays forbidden), and
        # checkpoint resume validation is typed by the checkpoint contracts.
        # adk is the one denied sibling — the engine consumes executors
        # through the TurnExecutor port and must never reach into a concrete
        # adapter, or the port loses its meaning.
        engine-never-imports-adk:
          files:
            - "**/internal/runtime/engine/**"
          deny:
            - pkg: github.com/anggasct/aura/internal/runtime/adk
              desc: the engine consumes executors through the TurnExecutor port and must not depend on the ADK adapter
        # The ADK adapter touches the runtime only through the root contract
        # package and the engine ports. Test files are exempt: they build
        # TurnRequests whose Parts field is typed by the ingress package.
        adk-via-root-and-engine-only:
          files:
            - "**/internal/runtime/adk/**"
            - "!$test"
          deny:
            - pkg: github.com/anggasct/aura/internal/runtime/ingress
              desc: the ADK adapter maps normalized TurnRequests, not channel ingress envelopes
            - pkg: github.com/anggasct/aura/internal/runtime/channelhost
              desc: outbound channel delivery belongs to the engine host and channel adapters, not the executor
            - pkg: github.com/anggasct/aura/internal/runtime/checkpoint
              desc: checkpoint resume flows through the engine, not the executor adapter
        # Ingress is the innermost contract: it must stay importable by every
        # runtime package, so it may depend on no internal package at all.
        # Deny paths are prefix matches, so the internal root covers the
        # whole internal tree.
        ingress-stays-innermost:
          files:
            - "**/internal/runtime/ingress/**"
          deny:
            - pkg: github.com/anggasct/aura/internal
              desc: ingress types are the innermost runtime contract and must not depend on any internal package
        # The channel contract layer may reference ingress types but no other
        # runtime package; lax mode lets the longer ingress allow entry win
        # over the runtime-tree deny prefix.
        channelhost-contract-only:
          list-mode: lax
          files:
            - "**/internal/runtime/channelhost/**"
          allow:
            - github.com/anggasct/aura/internal/runtime/ingress
          deny:
            - pkg: github.com/anggasct/aura/internal/runtime
              desc: channel contracts are consumed by the engine host and channel adapters, and must not reach back into the runtime tree beyond ingress types
        # The checkpoint contract layer binds to the store only; the runtime
        # root prefix deny covers the root package and every subpackage.
        checkpoint-contract-only:
          files:
            - "**/internal/runtime/checkpoint/**"
          deny:
            - pkg: github.com/anggasct/aura/internal/runtime
              desc: checkpoint contracts are store-facing boundaries consumed by the engine, and must not reach back into the runtime tree
        # Builtin tool adapters are assembled by the tools provider
        # (internal/tools/builtin); the cli composition root invokes that
        # constructor and must not reach into the adapter packages itself.
        # Lax mode lets the tools/builtin allow entry win over the internal
        # tools deny prefixes.
        tools-wired-only-through-builtin:
          list-mode: lax
          files:
            - "**/internal/cli/**"
          allow:
            - github.com/anggasct/aura/internal/tools/builtin
          deny:
            - pkg: github.com/anggasct/aura/internal/tools
              desc: the builtin adapter set is assembled in internal/tools/builtin; the cli composition root calls that constructor instead
            - pkg: github.com/anggasct/aura/internal/tools/exec
              desc: the exec adapter is constructed by internal/tools/builtin, not by the cli composition root
            - pkg: github.com/anggasct/aura/internal/tools/fetch
              desc: the fetch adapter is constructed by internal/tools/builtin, not by the cli composition root
            - pkg: github.com/anggasct/aura/internal/tools/filesystem
              desc: the filesystem adapters are constructed by internal/tools/builtin, not by the cli composition root
            - pkg: github.com/anggasct/aura/internal/tools/search
              desc: the search adapter is constructed by internal/tools/builtin, not by the cli composition root
    errcheck:
      # A deliberate ignore is written `_ =` at the call site so the decision
      # stays visible in review; check-blank would make that idiom impossible.
      check-blank: false
      check-type-assertions: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      # Error-code switches branch on the codes a caller handles and fall
      # through otherwise; a default arm is the intended exhaustive form.
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    recvcheck:
      # UnmarshalText must take a pointer to assign; String and MarshalYAML
      # must take a value so the type still formats and marshals when held by
      # value. No arrangement satisfies both plus a uniform receiver.
      exclusions:
        - ByteSize.UnmarshalText
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: identical-branches
        - name: range-val-address
        - name: redefines-builtin-id
        - name: string-of-int
        - name: time-equal
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: waitgroup-by-value
    sloglint:
      no-global: all
      context: all
      static-msg: true
      key-naming-case: snake

  exclusions:
    # No inherited preset sets: an exclusion nobody wrote down is an exclusion
    # nobody accepted. Every rule below states why it exists.
    generated: lax
    presets: []
    rules:
      # Test fixtures construct deliberately hostile inputs and small slices;
      # neither is a production concern.
      - path: _test\.go
        linters:
          - gosec
          - prealloc

      # Test helpers keep a uniform signature across call sites even when one
      # argument currently always receives the same value.
      - path: _test\.go
        linters:
          - unparam

      # Test-local structs are decoded for assertions only, never persisted.
      - path: _test\.go
        linters:
          - musttag

      # Every path reaching these opens is either operator-supplied config or
      # confined to the data root by resolveRootedPath before use.
      - linters:
          - gosec
        text: G304
        path: internal/(store|config|usage)/

      # The cgroup v2 directory comes from the kernel's /proc/self/cgroup for
      # this very process, never from external input.
      - linters:
          - gosec
        text: G304
        path: internal/cli/process_unix.go

      # Directories are hardened to 0700 exactly as the filesystem convention
      # requires; G302's 0600 ceiling is a file rule and cannot express the
      # execute bit a directory needs.
      - linters:
          - gosec
        text: G302
        path: internal/store/connection\.go

      # unsafe.Pointer is required to hand the seccomp action word to the
      # kernel probe; the value is a stack-local uint32.
      - linters:
          - gosec
        text: G103
        path: internal/sandbox/run_linux.go

      # Landlock and seccomp syscall arguments are stack-local structs handed
      # to the kernel through unsafe.Pointer; the values are built in-package.
      - linters:
          - gosec
        text: G103
        path: internal/sandbox/(seccomp_linux_amd64|landlock_linux)\.go

      # BPF jump offsets, Landlock file descriptors, and rlimit tuples use the
      # kernel's fixed integer widths; the source values are bounded syscall
      # numbers, file descriptors, and resource limits.
      - linters:
          - gosec
        text: G115
        path: internal/sandbox/(seccomp_linux_amd64|landlock_linux|rlimit_linux)\.go

      # Launching a caller-supplied command is this package's entire purpose;
      # the command is constrained by the containment spec, not by gosec.
      - linters:
          - gosec
        text: G204
        path: internal/sandbox/run_linux.go

      # Launching the operator's own \$EDITOR is the multiline gesture's
      # purpose; the value is as trusted as the command the operator typed.
      # G702 fires on the same launch for the same reason.
      - linters:
          - gosec
        text: G204
        path: internal/channel/terminal/ttyrender\.go
      - linters:
          - gosec
        text: G702
        path: internal/channel/terminal/ttyrender\.go

      # Retry jitter is not a security context. Scoped to the one file that
      # needs it rather than excluded repository-wide.
      - linters:
          - gosec
        text: G404
        path: internal/model/retry.go

      # Same retry-jitter rationale as internal/model/retry.go.
      - linters:
          - gosec
        text: G404
        path: internal/usage/busy.go

      # The signal-derived context does reach every command, but it travels
      # through cobra's command tree (ExecuteContext then cmd.Context()) and
      # the analyser cannot trace it across that indirection.
      - linters:
          - contextcheck
        path: internal/cli/root.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
